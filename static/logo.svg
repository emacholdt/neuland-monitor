<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="rotate(180, 50, 50)">
    <!-- Stylized Hands pointing DOWN -->
    <path d="M50 25 L85 65 L70 80 L50 60 L30 80 L15 65 Z" 
          fill="url(#neonGradient)" 
          fill-opacity="0.2" 
          stroke="url(#neonGradient)" 
          stroke-width="3" 
          stroke-linejoin="round"
          filter="url(#glow)"/>
          
    <!-- The actual Diamond (Raute) in the center -->
    <path d="M50 45 L62 60 L50 75 L38 60 Z" 
          fill="url(#neonGradient)" 
          filter="url(#glow)">
      <animate attributeName="fill-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
