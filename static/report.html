<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuland Monitor - Downtime Report</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-left img {
            width: 50px;
            height: auto;
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            text-align: right;
        }

        .report-period {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .value-green {
            color: var(--accent-green);
        }

        .value-red {
            color: var(--accent-red);
        }

        .value-blue {
            color: var(--accent-blue);
        }

        .table-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .report-footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        .report-footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .report-footer a:hover {
            text-decoration: underline;
        }

        .table-card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .loading {
            text-align: center;
            padding: 40px 0;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }

        /* Print Media Styles */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0;
            }

            .container {
                max-width: 100%;
            }

            .header {
                border-bottom: 2px solid #000000;
            }

            .header-title h1 {
                background: none !important;
                -webkit-text-fill-color: initial !important;
                color: #000000 !important;
            }

            .report-period {
                color: #555555 !important;
            }

            .stat-card {
                background: #ffffff !important;
                border: 1px solid #cccccc !important;
                box-shadow: none !important;
                color: #000000 !important;
            }

            .stat-label {
                color: #555555 !important;
            }

            .value-green, .value-red, .value-blue {
                color: #000000 !important;
            }

            .table-card {
                background: #ffffff !important;
                border: 1px solid #cccccc !important;
                box-shadow: none !important;
                color: #000000 !important;
                padding: 20px;
            }

            th {
                color: #333333 !important;
                border-bottom: 2px solid #000000 !important;
            }

            td {
                border-bottom: 1px solid #cccccc !important;
            }

            .no-print {
                display: none !important;
            }

            .report-footer {
                border-top: 1px solid #cccccc !important;
                color: #888888 !important;
            }

            .report-footer a {
                color: #555555 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="report-container">
        <div class="loading" id="loading-spinner">Loading report data...</div>
    </div>

    <script>
        // Parse query params
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start');
        const endParam = urlParams.get('end');
        const tokenParam = urlParams.get('token');
        const langParam = urlParams.get('lang') || localStorage.getItem('lang') || 'en';

        // Translations
        const t = {
            en: {
                title: 'Internet Downtime Report',
                period: 'Period',
                availability: 'Uptime Availability',
                total_downtime: 'Total Downtime',
                incident_count: 'Incident Count',
                longest_incident: 'Longest Incident',
                detailed_incidents: 'Detailed Downtime Incidents',
                no_incidents: 'No downtime recorded in this period.',
                col_start: 'Start Datetime',
                col_end: 'End Datetime',
                col_duration: 'Duration',
                col_checks: 'Checks',
                btn_close: 'Close',
                btn_csv: 'Export CSV',
                btn_print: 'Print / Save PDF',
                loading: 'Loading report data...',
                error: 'Error',
                error_missing: 'Missing required query parameters (start, end, or token).',
                error_failed: 'Failed to load report',
                error_unauth: 'Unauthorized (invalid token)',
                csv_header: 'Start,End,Duration (seconds),Ping Checks',
                footer: 'Generated with'
            },
            de: {
                title: 'Internet Ausfall-Bericht',
                period: 'Zeitraum',
                availability: 'Verfügbarkeit',
                total_downtime: 'Gesamte Ausfallzeit',
                incident_count: 'Anzahl Ausfälle',
                longest_incident: 'Längster Ausfall',
                detailed_incidents: 'Detaillierte Ausfall-Übersicht',
                no_incidents: 'Keine Ausfälle in diesem Zeitraum aufgezeichnet.',
                col_start: 'Anfang',
                col_end: 'Ende',
                col_duration: 'Dauer',
                col_checks: 'Messungen',
                btn_close: 'Schließen',
                btn_csv: 'CSV exportieren',
                btn_print: 'Drucken / PDF speichern',
                loading: 'Berichtsdaten werden geladen...',
                error: 'Fehler',
                error_missing: 'Fehlende Parameter (start, end oder token).',
                error_failed: 'Bericht konnte nicht geladen werden',
                error_unauth: 'Nicht autorisiert (ungültiges Token)',
                csv_header: 'Anfang,Ende,Dauer (Sekunden),Messungen',
                footer: 'Erstellt mit'
            },
            sx: {
                title: 'Internedd Ausfall-Zeddel',
                period: 'Zeitraum',
                availability: 'Verfiechbarkeet',
                total_downtime: 'Gesamde Ausfallzeit',
                incident_count: 'Wie oft kabudd',
                longest_incident: 'Längster Ausfall',
                detailed_incidents: 'Alles im Deedail',
                no_incidents: 'Nüscht passiert in der Zeit.',
                col_start: 'Anfang',
                col_end: 'Ende',
                col_duration: 'Wie lang',
                col_checks: 'Prüfunchn',
                btn_close: 'Zu de Bude',
                btn_csv: 'CSV runnerloodn',
                btn_print: 'Drucken / PDF machne',
                loading: 'Wart ma, Dadn werdn gelodn...',
                error: 'Uuups',
                error_missing: 'Da fehln Paramedder (start, end oder token).',
                error_failed: 'Zeddel gonnde nich gelodn werdn',
                error_unauth: 'Nich dazu berechticht (falschet Token)',
                csv_header: 'Anfang,Ende,Dauer (Segundn),Prüfunchn',
                footer: 'Gemachd mid'
            }
        };

        const lang = t[langParam] || t.en;
        let reportData = null;

        // Set page title
        document.title = lang.title;
        document.getElementById('loading-spinner').innerText = lang.loading;

        const getLocale = () => langParam === 'de' || langParam === 'sx' ? 'de-DE' : 'en-GB';

        function formatDuration(sec) {
            if (sec < 60) return `${Math.round(sec)}s`;
            const mins = Math.floor(sec / 60);
            const secs = Math.round(sec % 60);
            if (mins < 60) return `${mins}m ${secs}s`;
            const hrs = Math.floor(mins / 60);
            const remainingMins = mins % 60;
            return `${hrs}h ${remainingMins}m`;
        }

        function formatDate(isoStr) {
            const date = new Date(isoStr);
            return date.toLocaleString(getLocale());
        }

        function downloadCSV() {
            if (!reportData || !reportData.events) return;
            
            let csvRows = [];
            csvRows.push(lang.csv_header);
            
            reportData.events.forEach(event => {
                const start = formatDate(event.start).replace(/,/g, '');
                const end = formatDate(event.end).replace(/,/g, '');
                csvRows.push(`"${start}","${end}",${event.duration},${event.checks}`);
            });
            
            const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `neuland_downtime_report_${startParam.split('T')[0]}_to_${endParam.split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function fetchReportData() {
            if (!startParam || !endParam || !tokenParam) {
                document.getElementById('report-container').innerHTML = `
                    <div class="stat-card" style="margin-top: 50px;">
                        <h2 class="value-red">${lang.error}</h2>
                        <p style="margin-top: 15px;">${lang.error_missing}</p>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`../api/admin/report-data?start=${encodeURIComponent(startParam)}&end=${encodeURIComponent(endParam)}`, {
                    headers: { 'X-Admin-Password': tokenParam }
                });

                if (!response.ok) {
                    throw new Error(response.status === 403 ? lang.error_unauth : `HTTP error: ${response.status}`);
                }

                reportData = await response.json();
                renderReport(reportData);
            } catch (error) {
                document.getElementById('report-container').innerHTML = `
                    <div class="stat-card" style="margin-top: 50px;">
                        <h2 class="value-red">${lang.error_failed}</h2>
                        <p style="margin-top: 15px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderReport(data) {
            const container = document.getElementById('report-container');
            
            let tableRows = '';
            if (data.events.length === 0) {
                tableRows = `<tr><td colspan="4" class="empty-state">${lang.no_incidents}</td></tr>`;
            } else {
                data.events.forEach(event => {
                    tableRows += `
                        <tr>
                            <td>${formatDate(event.start)}</td>
                            <td>${formatDate(event.end)}</td>
                            <td>${formatDuration(event.duration)}</td>
                            <td>${event.checks}</td>
                        </tr>
                    `;
                });
            }

            container.innerHTML = `
                <div class="controls no-print">
                    <button class="btn btn-secondary" onclick="window.close()">${lang.btn_close}</button>
                    <button class="btn btn-secondary" onclick="downloadCSV()">${lang.btn_csv}</button>
                    <button class="btn btn-primary" onclick="window.print()">${lang.btn_print}</button>
                </div>

                <div class="header">
                    <div class="header-left">
                        <img src="logo.svg" alt="Logo">
                        <div class="header-title">
                            <h1>${lang.title}</h1>
                        </div>
                    </div>
                    <div class="header-right">
                        <div style="font-weight: 600; font-size: 0.9rem; text-transform: uppercase; color: var(--text-secondary);">${lang.period}</div>
                        <div class="report-period" style="font-weight: 600; color: var(--text-primary);">${formatDate(data.start)} — ${formatDate(data.end)}</div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">${lang.availability}</div>
                        <div class="stat-value ${data.availability >= 99.9 ? 'value-green' : data.availability >= 99.0 ? 'value-blue' : 'value-red'}">${data.availability}%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">${lang.total_downtime}</div>
                        <div class="stat-value value-red">${formatDuration(data.total_downtime_seconds)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">${lang.incident_count}</div>
                        <div class="stat-value value-blue">${data.incidents_count}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">${lang.longest_incident}</div>
                        <div class="stat-value value-red">${formatDuration(data.longest_downtime_seconds)}</div>
                    </div>
                </div>

                <div class="table-card">
                    <h2>${lang.detailed_incidents}</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>${lang.col_start}</th>
                                <th>${lang.col_end}</th>
                                <th>${lang.col_duration}</th>
                                <th>${lang.col_checks}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>

                <div class="report-footer">
                    ${lang.footer} <a href="https://github.com/emacholdt/neuland-monitor" target="_blank">Neuland Monitor</a> v${data.version || '1.0.0'}
                </div>
            `;
        }

        fetchReportData();
    </script>
</body>
</html>
