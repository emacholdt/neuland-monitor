<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuland Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .background-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: -1;
            top: -100px;
            left: -100px;
            filter: blur(50px);
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(200px, 200px);
            }
        }

        .container {
            width: 100%;
            max-width: 600px;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 24px;
            transition: all 0.5s ease;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .last-update {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .footer {
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .footer:hover {
            opacity: 1;
        }

        /* Admin Modal */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="background-blob"></div>

    <div class="container">
        <div class="card" id="main-card">
            <div id="status-badge" class="status-badge status-online">
                Checking...
            </div>
            <h1>Neuland Monitor</h1>
            <p class="last-update" id="last-ping">Waiting for data...</p>

            <div class="stats-grid">
                <div class="stat-item" style="grid-column: span 2;">
                    <span class="stat-label">Availability (Last 60m)</span>
                    <div id="availability-timeline" style="display: flex; gap: 4px; height: 20px; margin-top: 10px;">
                        <!-- Dots will be generated here -->
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Download</span>
                    <span class="stat-value" id="download">--</span>
                    <span class="stat-unit">Mbps</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Upload</span>
                    <span class="stat-value" id="upload">--</span>
                    <span class="stat-unit">Mbps</span>
                </div>
                <div class="stat-item" style="grid-column: span 2; padding: 10px;">
                    <span class="stat-label">Speed History</span>
                    <canvas id="speedChart" style="width: 100%; height: 150px;"></canvas>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Ping</span>
                    <span class="stat-value" id="latency">--</span>
                    <span class="stat-unit">ms</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Last Speedtest</span>
                    <span class="stat-value" id="last-speed-time" style="font-size: 0.9rem;">--</span>
                </div>
            </div>

            <div class="footer" onclick="showAdmin()">
                Admin Settings
            </div>
        </div>
    </div>

    <div id="admin-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Admin Access</h2>
            <input type="password" id="admin-pass" placeholder="Password">
            <button onclick="loginAdmin()">View Config</button>
            <button onclick="triggerSpeedtest()" id="btn-speedtest" style="background: var(--accent-green); margin-top: 10px;">Run Speedtest Now</button>
            <button onclick="hideAdmin()"
                style="background: transparent; border: 1px solid var(--text-secondary); margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let adminPassword = '';
        let speedChart = null;

        function initChart() {
            const ctx = document.getElementById('speedChart').getContext('2d');
            speedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Down',
                            data: [],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Up',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { 
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                const badge = document.getElementById('status-badge');
                if (data.is_online) {
                    badge.innerText = '● Connected';
                    badge.className = 'status-badge status-online';
                } else {
                    badge.innerText = '○ Offline';
                    badge.className = 'status-badge status-offline';
                }

                document.getElementById('last-ping').innerText = `Last checked: ${new Date(data.last_ping).toLocaleTimeString()}`;
                
                // Update Timeline
                const timeline = document.getElementById('availability-timeline');
                timeline.innerHTML = '';
                // Fill up to 60 dots
                const pings = data.ping_history || [];
                for (let i = 0; i < 60; i++) {
                    const dot = document.createElement('div');
                    dot.style.flex = '1';
                    dot.style.borderRadius = '2px';
                    if (i < (60 - pings.length)) {
                        dot.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                    } else {
                        const p = pings[i - (60 - pings.length)];
                        dot.style.backgroundColor = p.online ? 'var(--accent-green)' : 'var(--accent-red)';
                        dot.title = `${new Date(p.time).toLocaleTimeString()}: ${p.online ? 'Online' : 'Offline'}`;
                    }
                    timeline.appendChild(dot);
                }

                // Show loading for speedtest if running
                if (data.is_running_speedtest) {
                    document.getElementById('download').innerText = '...';
                    document.getElementById('upload').innerText = '...';
                    document.getElementById('btn-speedtest').innerText = 'Running...';
                    document.getElementById('btn-speedtest').disabled = true;
                } else {
                    document.getElementById('download').innerText = data.download_mbps || '--';
                    document.getElementById('upload').innerText = data.upload_mbps || '--';
                    document.getElementById('btn-speedtest').innerText = 'Run Speedtest Now';
                    document.getElementById('btn-speedtest').disabled = false;
                }

                // Update Chart
                if (speedChart && data.speed_history && data.speed_history.length > 0) {
                    speedChart.data.labels = data.speed_history.map(s => new Date(s.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
                    speedChart.data.datasets[0].data = data.speed_history.map(s => s.download);
                    speedChart.data.datasets[1].data = data.speed_history.map(s => s.upload);
                    speedChart.update('none');
                }

                document.getElementById('latency').innerText = data.current_latency.toFixed(1) || '--';
                
                if (data.last_speedtest) {
                    const speedDate = new Date(data.last_speedtest.timestamp);
                    document.getElementById('last-speed-time').innerText = speedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            } catch (error) {
                console.error('Failed to fetch status:', error);
            }
        }

        function showAdmin() {
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function hideAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        async function loginAdmin() {
            adminPassword = document.getElementById('admin-pass').value;
            try {
                const response = await fetch(`/api/config?password=${adminPassword}`);
                if (response.ok) {
                    const config = await response.json();
                    alert(`Config:\nPing: every ${config.ping_interval}s\nSpeedtest: every ${config.speedtest_interval}m\nInfluxDB: ${config.influxdb_url}`);
                    hideAdmin();
                } else {
                    alert('Invalid password');
                }
            } catch (error) {
                alert('Connection error');
            }
        }

        async function triggerSpeedtest() {
            const pass = document.getElementById('admin-pass').value || adminPassword;
            if (!pass) {
                alert('Please enter password first');
                return;
            }
            try {
                const response = await fetch(`/api/speedtest/trigger?password=${pass}`, { method: 'POST' });
                const result = await response.json();
                if (response.ok) {
                    alert('Speedtest started! It will take about 30-60 seconds.');
                    hideAdmin();
                    updateStatus();
                } else {
                    alert(`Error: ${result.detail || result.status}`);
                }
            } catch (error) {
                alert('Connection error');
            }
        }

        // Initial update and interval
        initChart();
        updateStatus();
        setInterval(updateStatus, 5000);
    </script>
</body>

</html>
